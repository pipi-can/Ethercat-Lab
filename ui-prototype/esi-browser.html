<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtherCAT Lab — ESI Browser UI Prototype</title>
<style>
/* ============================================================
 * 全局重置 & CSS 变量（对应 QML 配色系统）
 * ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:             #15181d;
  --surface:        #1c1f26;
  --surface-hover:  #252830;
  --surface-active: #2c3040;
  --border:         #2a2e36;
  --border-light:   #333844;
  --text-primary:   #d4d7dc;
  --text-secondary: #88909e;
  --text-dim:       #555c69;
  --accent:         #5294e2;
  --accent-dim:     #1e5099;
  --accent-bg:      rgba(82,148,226,0.08);
  --warm:           #d4844a;
  --warm-bg:        rgba(212,132,74,0.08);
  --green:          #42a85f;
  --green-bg:       rgba(66,168,95,0.08);
  --red:            #e0554a;
  --red-bg:         rgba(224,85,74,0.08);
  --nav-rail:       #111318;
  --font-sans:      'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:      'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  --radius-sm:      4px;
  --radius-md:      6px;
  --radius-lg:      10px;
  --transition:     150ms ease;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-primary);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
 * 整体布局：纵向 header + body + footer
 * ============================================================ */
#app {
  display: flex; flex-direction: column;
  width: 100%; height: 100%;
}

/* ============================================================
 * 顶部工具栏
 * ============================================================ */
#toolbar {
  height: 46px; min-height: 46px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px; gap: 6px;
  user-select: none;
}

.tool-btn {
  width: 32px; height: 32px;
  border: none; background: transparent;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), color var(--transition);
  position: relative;
}
.tool-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.tool-btn svg { width: 18px; height: 18px; }

.toolbar-sep {
  width: 1px; height: 20px;
  background: var(--border);
  margin: 0 4px;
}

.toolbar-filename {
  font-size: 12px; color: var(--text-primary);
  margin-right: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 260px;
}
.toolbar-filename .dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: 50%; background: var(--green);
  margin-right: 6px; vertical-align: middle;
}

.search-box {
  width: 220px; height: 30px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex; align-items: center;
  padding: 0 8px; gap: 6px;
  transition: border-color var(--transition);
}
.search-box:focus-within { border-color: var(--accent); }
.search-box svg { width: 14px; height: 14px; color: var(--text-dim); flex-shrink: 0; }
.search-box input {
  flex: 1; border: none; background: transparent;
  color: var(--text-primary); font-size: 12px;
  font-family: var(--font-sans); outline: none;
}
.search-box input::placeholder { color: var(--text-dim); }

/* ============================================================
 * 主体区域
 * ============================================================ */
#main {
  flex: 1; display: flex; overflow: hidden;
}

/* ---- 左侧导航轨 ---- */
#nav-rail {
  width: 48px; min-width: 48px;
  background: var(--nav-rail);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 8px 0; gap: 2px;
  user-select: none;
}

.nav-btn {
  width: 40px; height: 40px;
  border: none; background: transparent;
  border-radius: var(--radius-md);
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), color var(--transition);
  position: relative;
}
.nav-btn:hover { background: var(--surface-hover); color: var(--text-secondary); }
.nav-btn.active {
  background: var(--accent-dim); color: #fff;
}
.nav-btn.active::before {
  content: '';
  position: absolute; left: -4px;
  width: 3px; height: 20px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}
.nav-btn svg { width: 20px; height: 20px; }
.nav-spacer { flex: 1; }

/* 导航按钮 tooltip */
.nav-btn[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute; left: 52px; top: 50%;
  transform: translateY(-50%);
  background: #2a2e38; color: var(--text-primary);
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 11px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  z-index: 100;
  pointer-events: none;
}

/* ---- 树形面板 ---- */
#tree-panel {
  width: 310px; min-width: 240px; max-width: 450px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  user-select: none;
  position: relative;
}

.panel-header {
  height: 38px; min-height: 38px;
  display: flex; align-items: center;
  padding: 0 12px; gap: 8px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 11px; font-weight: 600;
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.panel-badge {
  margin-left: auto;
  font-size: 10px; color: var(--text-dim);
}

.tree-container {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 4px 0;
}
.tree-container::-webkit-scrollbar { width: 6px; }
.tree-container::-webkit-scrollbar-track { background: transparent; }
.tree-container::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 3px;
}
.tree-container::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* 树节点 */
.tree-node {
  position: relative;
}
.tree-row {
  height: 30px;
  display: flex; align-items: center;
  padding-right: 10px;
  cursor: pointer;
  transition: background var(--transition);
  position: relative;
}
.tree-row:hover { background: var(--surface-hover); }
.tree-row.selected { background: var(--accent-dim); }
.tree-row.selected .tree-label { color: #fff; }

/* 缩进引导线 */
.tree-indent {
  display: inline-flex; align-items: stretch;
  height: 30px; flex-shrink: 0;
}
.tree-indent-guide {
  width: 20px; height: 100%; position: relative;
}
.tree-indent-guide::after {
  content: '';
  position: absolute; left: 10px; top: 0;
  width: 1px; height: 100%;
  background: var(--border);
}

/* 展开/折叠箭头 */
.tree-arrow {
  width: 20px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  color: var(--text-dim);
  transition: transform 200ms ease, color var(--transition);
}
.tree-arrow svg { width: 12px; height: 12px; }
.tree-arrow.expanded { transform: rotate(90deg); }
.tree-arrow.hidden { visibility: hidden; }
.tree-row:hover .tree-arrow { color: var(--text-secondary); }

/* 节点图标 */
.tree-icon {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-right: 6px;
  border-radius: var(--radius-sm);
}
.tree-icon svg { width: 16px; height: 16px; }
.tree-icon.vendor   { color: var(--warm);   background: var(--warm-bg);   }
.tree-icon.group    { color: var(--accent);  background: var(--accent-bg); }
.tree-icon.device   { color: var(--green);  background: var(--green-bg);  }
.tree-icon.sm       { color: var(--warm);   background: var(--warm-bg);   }
.tree-icon.sm-in    { color: var(--green);  background: var(--green-bg);  }
.tree-icon.pdo-rx   { color: var(--accent); background: var(--accent-bg); }
.tree-icon.pdo-tx   { color: var(--green);  background: var(--green-bg);  }
.tree-icon.entry    { color: var(--text-secondary); background: rgba(136,144,158,0.08); }
.tree-icon.mailbox  { color: var(--warm);   background: var(--warm-bg);   }
.tree-icon.dc       { color: var(--accent); background: var(--accent-bg); }

.tree-label {
  font-size: 12px; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1;
  line-height: 30px;
}

/* 徽章 */
.tree-badge {
  flex-shrink: 0;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  color: #fff;
  margin-left: 6px;
  letter-spacing: 0.3px;
}
.tree-badge.size   { background: rgba(136,144,158,0.25); color: var(--text-secondary); }
.tree-badge.rx     { background: var(--accent-dim); }
.tree-badge.tx     { background: rgba(66,168,95,0.3); color: var(--green); }
.tree-badge.bits   { background: rgba(136,144,158,0.15); color: var(--text-dim); font-family: var(--font-mono); font-size: 9px; }

/* 子节点容器 */
.tree-children {
  overflow: hidden;
  transition: max-height 250ms ease;
}
.tree-children.collapsed {
  max-height: 0 !important;
}

/* ---- 面板拖拽调整宽度的手柄 ---- */
.resize-handle {
  width: 4px; cursor: col-resize;
  background: transparent;
  transition: background var(--transition);
  flex-shrink: 0;
}
.resize-handle:hover, .resize-handle.active {
  background: var(--accent);
}

/* ---- 中央内容区 ---- */
#center-panel {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
}

/* 面包屑 */
#breadcrumb {
  height: 34px; min-height: 34px;
  display: flex; align-items: center;
  padding: 0 16px; gap: 4px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  font-size: 11px;
}
.crumb {
  color: var(--text-dim);
  cursor: pointer;
  transition: color var(--transition);
  white-space: nowrap;
}
.crumb:hover { color: var(--accent); }
.crumb.current { color: var(--text-primary); cursor: default; }
.crumb-sep { color: var(--text-dim); margin: 0 2px; font-size: 10px; }

/* 中央内容滚动区 */
#center-content {
  flex: 1; overflow-y: auto; padding: 24px;
}
#center-content::-webkit-scrollbar { width: 6px; }
#center-content::-webkit-scrollbar-track { background: transparent; }
#center-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 空状态 */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 16px; opacity: 0.4;
}
.empty-state svg { width: 64px; height: 64px; color: var(--text-dim); }
.empty-state p { color: var(--text-dim); font-size: 14px; }

/* 设备概览卡片 */
.detail-hero {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 24px;
}
.detail-hero-icon {
  width: 52px; height: 52px;
  border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.detail-hero-icon svg { width: 28px; height: 28px; }
.detail-hero-text h2 {
  font-size: 17px; font-weight: 600;
  color: var(--text-primary); margin-bottom: 4px;
}
.detail-hero-text p {
  font-size: 12px; color: var(--text-secondary);
}

/* 属性分组卡片 */
.prop-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
  animation: fadeInUp 250ms ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.prop-card-header {
  height: 38px;
  display: flex; align-items: center;
  padding: 0 14px; gap: 8px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
}
.prop-card-header svg { width: 14px; height: 14px; color: var(--text-dim); }
.prop-card-header span {
  font-size: 11px; font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px;
}

.prop-row {
  display: flex; align-items: center;
  padding: 0 14px; height: 34px;
  border-bottom: 1px solid rgba(42,46,54,0.5);
  transition: background var(--transition);
}
.prop-row:last-child { border-bottom: none; }
.prop-row:hover { background: rgba(255,255,255,0.015); }

.prop-key {
  width: 140px; min-width: 140px;
  font-size: 11px; color: var(--text-secondary);
}
.prop-val {
  flex: 1; font-size: 12px; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.prop-val.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.3px; }
.prop-val.accent { color: var(--accent); }
.prop-val.green  { color: var(--green); }
.prop-val.warn   { color: var(--warm); }
.prop-val.red    { color: var(--red); }

/* 状态标签 */
.status-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 3px;
  font-size: 10px; font-weight: 600;
}
.status-tag.supported { background: var(--green-bg); color: var(--green); }
.status-tag.not-supported { background: rgba(85,92,105,0.15); color: var(--text-dim); }

/* SM 可视化条 */
.sm-bar-container { margin-bottom: 16px; }
.sm-bar-label {
  display: flex; justify-content: space-between;
  margin-bottom: 6px; font-size: 11px;
}
.sm-bar-label span:first-child { color: var(--text-secondary); }
.sm-bar-label span:last-child { color: var(--text-dim); font-family: var(--font-mono); font-size: 10px; }

.sm-bar {
  height: 8px; border-radius: 4px;
  background: rgba(255,255,255,0.05);
  overflow: hidden;
}
.sm-bar-fill {
  height: 100%; border-radius: 4px;
  transition: width 400ms ease;
}

/* PDO Entry 表格 */
.entry-table {
  width: 100%; border-collapse: collapse;
  font-size: 11px;
}
.entry-table th {
  text-align: left; padding: 8px 12px;
  font-size: 10px; font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
}
.entry-table td {
  padding: 7px 12px;
  border-bottom: 1px solid rgba(42,46,54,0.4);
  color: var(--text-primary);
}
.entry-table tr:hover td { background: rgba(255,255,255,0.015); }
.entry-table td.mono {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent);
}
.entry-table td .type-tag {
  padding: 1px 5px; border-radius: 3px;
  background: rgba(136,144,158,0.12);
  color: var(--text-secondary);
  font-size: 10px; font-family: var(--font-mono);
}
.entry-table td .bit-bar {
  display: inline-block; height: 6px; border-radius: 3px;
  margin-right: 6px; vertical-align: middle;
  min-width: 8px;
}

/* ---- 右侧属性面板 ---- */
#prop-panel {
  width: 280px; min-width: 200px; max-width: 380px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  user-select: none;
}

#prop-panel .panel-header {
  border-bottom: 1px solid var(--border);
}

.prop-list {
  flex: 1; overflow-y: auto; padding: 2px 0;
}
.prop-list::-webkit-scrollbar { width: 6px; }
.prop-list::-webkit-scrollbar-track { background: transparent; }
.prop-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.prop-list-section {
  padding: 10px 12px 4px;
  font-size: 10px; font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
}

.prop-list-item {
  display: flex; align-items: center;
  padding: 6px 12px; gap: 6px;
  transition: background var(--transition);
}
.prop-list-item:hover { background: var(--surface-hover); }
.prop-list-item .key {
  width: 100px; min-width: 100px;
  font-size: 11px; color: var(--text-secondary);
}
.prop-list-item .val {
  flex: 1; font-size: 11px; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.prop-list-item .val.mono { font-family: var(--font-mono); font-size: 11px; }
.prop-list-item .val.accent { color: var(--accent); }
.prop-list-item .val.green  { color: var(--green); }
.prop-list-item .val.warn   { color: var(--warm); }

.prop-empty {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-dim); font-size: 12px;
}

/* ============================================================
 * 底部状态栏
 * ============================================================ */
#statusbar {
  height: 26px; min-height: 26px;
  background: var(--nav-rail);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px; gap: 10px;
  font-size: 10px; color: var(--text-dim);
  user-select: none;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
}
.status-text { color: var(--text-secondary); }
.status-sep { width: 1px; height: 12px; background: var(--border); }
.status-spacer { flex: 1; }

/* ============================================================
 * 工具提示
 * ============================================================ */
.tooltip-wrapper { position: relative; }
.tooltip-wrapper[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: #2a2e38; color: var(--text-primary);
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 11px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  z-index: 100;
  pointer-events: none;
}
</style>
</head>
<body>

<div id="app">

  <!-- ==================== 顶部工具栏 ==================== -->
  <div id="toolbar">
    <button class="tool-btn tooltip-wrapper" data-tip="Open ESI File (Ctrl+O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    </button>
    <button class="tool-btn tooltip-wrapper" data-tip="Recent Files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </button>
    <div class="toolbar-sep"></div>
    <div class="toolbar-filename">
      <span class="dot"></span>cs301_servo.xml
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search nodes... (Ctrl+F)">
    </div>
  </div>

  <!-- ==================== 主体区域 ==================== -->
  <div id="main">

    <!-- ---- 左侧导航轨 ---- -->
    <div id="nav-rail">
      <button class="nav-btn active" data-tooltip="ESI Browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      </button>
      <button class="nav-btn" data-tooltip="Object Dictionary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      </button>
      <button class="nav-btn" data-tooltip="PDO Mapping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </button>
      <button class="nav-btn" data-tooltip="Concept Graph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><circle cx="5" cy="19" r="2"/><line x1="14" y1="10" x2="17.4" y2="6.6"/><line x1="10" y1="10" x2="6.6" y2="6.6"/><line x1="14" y1="14" x2="17.4" y2="17.4"/><line x1="10" y1="14" x2="6.6" y2="17.4"/></svg>

  arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  id: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>`,
  pdo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
};

/* ============================================================
 * 全局状态
 * ============================================================ */
let selectedNodeId = null;
let expandedNodes = new Set(["root", "group1", "dev1"]);

/* ============================================================
 * 渲染树形结构
 * ============================================================ */
function renderTree() {
  const container = document.getElementById("treeContainer");
  container.innerHTML = "";
  container.appendChild(buildTreeNode(TREE_DATA, 0, []));

  let count = 0;
  function countNodes(node) {
    count++;
    if (node.children) node.children.forEach(countNodes);
  }
  countNodes(TREE_DATA);
  document.getElementById("nodeCount").textContent = count + " nodes";
}

function buildTreeNode(node, depth, ancestors) {
  const wrapper = document.createElement("div");
  wrapper.className = "tree-node";
  wrapper.dataset.id = node.id;

  const hasChildren = node.children && node.children.length > 0;
  const isExpanded = expandedNodes.has(node.id);
  const isSelected = selectedNodeId === node.id;

  const row = document.createElement("div");
  row.className = "tree-row" + (isSelected ? " selected" : "");
  row.dataset.nodeId = node.id;

  let indent = "";
  for (let i = 0; i < depth; i++) {
    indent += `<div class="tree-indent-guide"></div>`;
  }

  const arrowClass = hasChildren
    ? (isExpanded ? "tree-arrow expanded" : "tree-arrow")
    : "tree-arrow hidden";

  row.innerHTML = `
    <div class="tree-indent">${indent}</div>
    <div class="${arrowClass}">${ICONS.arrow}</div>
    <div class="tree-icon ${node.icon}">${ICONS[node.icon] || ""}</div>
    <span class="tree-label">${node.name}</span>
    ${node.badge ? `<span class="tree-badge ${node.badgeClass || ''}">${node.badge}</span>` : ""}
  `;

  row.addEventListener("click", () => {
    if (hasChildren) {
      if (expandedNodes.has(node.id)) {
        expandedNodes.delete(node.id);
      } else {
        expandedNodes.add(node.id);
      }
    }
    selectedNodeId = node.id;
    renderTree();
    showDetail(node);
    showBreadcrumb([...ancestors, node]);
    showProps(node);
  });

  wrapper.appendChild(row);

  if (hasChildren) {
    const childContainer = document.createElement("div");
    childContainer.className = "tree-children" + (isExpanded ? "" : " collapsed");
    if (isExpanded) {
      node.children.forEach(child => {
        childContainer.appendChild(buildTreeNode(child, depth + 1, [...ancestors, node]));
      });
    }
    wrapper.appendChild(childContainer);
  }

  return wrapper;
}

/* ============================================================
 * 面包屑导航
 * ============================================================ */
function showBreadcrumb(path) {
  const el = document.getElementById("breadcrumb");
  el.innerHTML = "";
  path.forEach((node, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      el.appendChild(sep);
    }
    const crumb = document.createElement("span");
    crumb.className = "crumb" + (i === path.length - 1 ? " current" : "");
    crumb.textContent = node.name.length > 30 ? node.name.substring(0, 28) + "…" : node.name;
    el.appendChild(crumb);
  });
}

/* ============================================================
 * 中央详情区
 * ============================================================ */
function showDetail(node) {
  const empty = document.getElementById("emptyState");
  const view = document.getElementById("detailView");

  if (!node.detail) {
    empty.style.display = "flex";
    view.style.display = "none";
    return;
  }

  empty.style.display = "none";
  view.style.display = "block";

  let html = "";

  if (node.detail.heroIcon) {
    const colorMap = { green: "var(--green)", accent: "var(--accent)", warm: "var(--warm)" };
    const bgMap = { green: "var(--green-bg)", accent: "var(--accent-bg)", warm: "var(--warm-bg)" };
    const c = node.detail.heroColor || "accent";
    html += `
      <div class="detail-hero">
        <div class="detail-hero-icon" style="background:${bgMap[c]};color:${colorMap[c]}">
          ${ICONS[node.detail.heroIcon] || ""}
        </div>
        <div class="detail-hero-text">
          <h2>${node.detail.title}</h2>
          <p>${node.detail.heroSub || ""}</p>
        </div>
      </div>`;
  } else {
    html += `<div class="detail-hero">
      <div class="detail-hero-text">
        <h2>${node.detail.title}</h2>
      </div>
    </div>`;
  }

  if (node.smSize !== undefined) {
    const pct = Math.min((node.smSize / node.smMax) * 100, 100);
    const smColor = node.icon === "sm-in" ? "var(--green)" : "var(--warm)";
    html += `
      <div class="sm-bar-container">
        <div class="sm-bar-label">
          <span>Memory Usage</span>
          <span>${node.smSize} / ${node.smMax} bytes (${Math.round(pct)}%)</span>
        </div>
        <div class="sm-bar">
          <div class="sm-bar-fill" style="width:${pct}%;background:${smColor}"></div>
        </div>
      </div>`;
  }

  if (node.entries) {
    const maxBits = Math.max(...node.entries.map(e => e.bits));
    const bitColors = { 8: "var(--warm)", 16: "var(--accent)", 32: "var(--green)" };
    html += `
      <div class="prop-card" style="animation-delay:50ms">
        <div class="prop-card-header">
          ${ICONS.pdo}
          <span>PDO Entries (${node.entries.length})</span>
        </div>
        <table class="entry-table">
          <thead><tr><th>Index</th><th>Name</th><th>Type</th><th>Bits</th></tr></thead>
          <tbody>`;
    node.entries.forEach(e => {
      const barW = (e.bits / 32) * 60;
      html += `<tr>
        <td class="mono">${e.idx}:${e.sub}</td>
        <td>${e.name}</td>
        <td><span class="type-tag">${e.type}</span></td>
        <td>
          <span class="bit-bar" style="width:${barW}px;background:${bitColors[e.bits] || 'var(--text-dim)'}"></span>
          ${e.bits}
        </td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  node.detail.sections.forEach((sec, si) => {
    html += `
      <div class="prop-card" style="animation-delay:${(si + 1) * 60}ms">
        <div class="prop-card-header">
          ${ICONS[sec.icon] || ICONS.info}
          <span>${sec.title}</span>
        </div>`;
    sec.rows.forEach(r => {
      let cls = "prop-val";
      if (r.mono)   cls += " mono";
      if (r.accent) cls += " accent";
      if (r.green)  cls += " green";
      if (r.warn)   cls += " warn";
      if (r.red)    cls += " red";

      let valHtml = r.val;
      if (r.green)  valHtml = `<span class="status-tag supported">${r.val}</span>`;
      if (r.dim)    valHtml = `<span class="status-tag not-supported">${r.val}</span>`;

      html += `
        <div class="prop-row">
          <span class="prop-key">${r.key}</span>
          <span class="${cls}">${valHtml}</span>
        </div>`;
    });
    html += `</div>`;
  });

  view.innerHTML = html;
}

/* ============================================================
 * 右侧属性面板
 * ============================================================ */
function showProps(node) {
  const list = document.getElementById("propList");
  const empty = document.getElementById("propEmpty");

  if (!node.detail) {
    list.innerHTML = "";
    list.appendChild(empty);
    empty.style.display = "flex";
    return;
  }

  let html = "";
  node.detail.sections.forEach(sec => {
    html += `<div class="prop-list-section">${sec.title}</div>`;
    sec.rows.forEach(r => {
      let cls = "val";
      if (r.mono) cls += " mono";
      if (r.accent) cls += " accent";
      if (r.green) cls += " green";
      if (r.warn) cls += " warn";
      html += `
        <div class="prop-list-item">
          <span class="key">${r.key}</span>
          <span class="${cls}">${r.val}</span>
        </div>`;
    });
  });

  list.innerHTML = html;
}

/* ============================================================
 * 面板宽度拖拽调整
 * ============================================================ */
function initResize(handleId, panelId, side) {
  const handle = document.getElementById(handleId);
  const panel = document.getElementById(panelId);
  let startX, startW;

  handle.addEventListener("mousedown", e => {
    e.preventDefault();
    startX = e.clientX;
    startW = panel.offsetWidth;
    handle.classList.add("active");

    function onMove(e) {
      const dx = e.clientX - startX;
      const newW = side === "left" ? startW + dx : startW - dx;
      const min = parseInt(getComputedStyle(panel).minWidth) || 200;
      const max = parseInt(getComputedStyle(panel).maxWidth) || 500;
      panel.style.width = Math.max(min, Math.min(max, newW)) + "px";
    }
    function onUp() {
      handle.classList.remove("active");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

/* ============================================================
 * 初始化
 * ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  renderTree();
  initResize("resizeLeft", "tree-panel", "left");
  initResize("resizeRight", "prop-panel", "right");

  document.getElementById("breadcrumb").innerHTML =
    '<span class="crumb current" style="color:var(--text-dim)">Select a node…</span>';
});
</script>
